; ============================================================
; CYBER CLOCK — M5Cardputer (Cardputer / Cardputer-Adv 共用)
; 基线 (2026-09): espressif32 @ 55.3.39 (pioarduino) / arduino-esp32 3.3.9 / IDF 5.5.4
; ============================================================
[env:cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; Cardputer-Adv = Stamp-S3A = ESP32-S3FN8 → 无 PSRAM, 不能开 psram, 也不要 -DBOARD_HAS_PSRAM。
; 本项目不依赖 PSRAM (全屏 sprite 走内部 DMA RAM), 所以关闭对原版 Cardputer 同样安全。
; 已知可用配置参考: ~/esp32/cardputer-camera/cardputer/platformio.ini
board_build.psram = disable
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARCADIA_CARDPUTER
    ; 同上: 公开树 vendored 一份, sync 脚本把这一行改写成 ${PROJECT_DIR}/../arcadia。
    ; 不要再加 -I../src/ (那会把 StickS3 源码树塞进 Cardputer 的头文件搜索路径)。
    -I${PROJECT_DIR}/../arcadia
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    m5stack/M5Unified
    m5stack/M5Cardputer

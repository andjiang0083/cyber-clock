[env:sticks3]
; 已验证基线 (2026-09): espressif32 @ 55.3.39 (pioarduino) / framework-arduinoespressif32 3.3.9 / IDF 5.5.4
;   查询: pio pkg list -e sticks3
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Enable 8MB Octal PSRAM (N8R8 variant)
board_build.psram = enable
board_build.arduino.memory_type = qio_opi

; USB CDC serial
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARCADIA_STICKS3
    ; arcadia 是 sibling checkout (~/esp32/arcadia)。公开树 vendored 一份, 由
    ; tools/sync-cyber-clock-public.sh 把这一行改写成 ${PROJECT_DIR}/arcadia。
    -I${PROJECT_DIR}/arcadia

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    m5stack/M5Unified
